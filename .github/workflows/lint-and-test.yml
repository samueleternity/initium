name: lint and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the lint and type-check jobs
        type: string
        required: false
        default: "3.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ inputs.python-version || '3.12' }}

jobs:
  # Ruff only: needs no torch, finishes in seconds. Read-only (no formatting is applied in CI).
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-suffix: lint
          cache-dependency-glob: pyproject.toml
      - uses: extractions/setup-just@v3
      - name: Install lint tools
        run: |
          uv venv
          uv pip install --group lint
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff lint
        run: just lint
      - name: Ruff format check
        run: just format-check

  # mypy needs torch's type information; the CPU wheel is small and cached.
  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          prune-cache: false          # keep the downloaded torch wheel in the cache
          cache-suffix: typecheck
          cache-dependency-glob: pyproject.toml
      - uses: extractions/setup-just@v3
      - name: Install type-check environment
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --group typecheck
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Mypy
        run: just typecheck

  # ---- reserved for the test suite ---------------------------------------------
  # `test` stays skipped (counts as success) until a tests/ directory with test files exists.
  detect-tests:
    name: detect tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tests
      - id: detect
        run: |
          if [ -n "$(find tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=tests::no tests found - test job skipped (placeholder)"
          fi

  test:
    name: test (py${{ matrix.python-version }})
    needs: detect-tests
    if: needs.detect-tests.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: false
          cache-suffix: test-${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml
      - uses: extractions/setup-just@v3
      - name: Install test environment (CPU only)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group test
          .venv/bin/python setup_wheels.py --skip gpu-wheels   # pytorch-dnc from git; no CUDA on runners
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: just test
