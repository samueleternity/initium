name: lint and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the lint and type-check jobs
        type: string
        required: false
        default: "3.12"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: ${{ inputs.python-version || '3.12' }}

jobs:
  # Ruff only: needs no torch, finishes in seconds. Read-only (no formatting is applied in CI).
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-suffix: lint
          cache-dependency-glob: pyproject.toml
      - uses: extractions/setup-just@v3
      - name: Install lint tools
        run: |
          uv venv
          uv pip install --group lint
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Ruff lint
        run: just lint
      - name: Ruff format check
        run: just format-check

  # mypy needs torch's type information; the CPU wheel is small and cached.
  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          prune-cache: false          # keep the downloaded torch wheel in the cache
          cache-suffix: typecheck
          cache-dependency-glob: pyproject.toml
      - uses: extractions/setup-just@v3
      - name: Install type-check environment
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --group typecheck
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Mypy
        run: just typecheck

  # ---- reserved for the test suite ---------------------------------------------
  # `test` stays skipped (counts as success) until a tests/ directory with test files exists.
  detect-tests:
    name: detect tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      present: ${{ steps.detect.outputs.present }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tests
      - id: detect
        run: |
          if [ -n "$(find tests -name 'test_*.py' -o -name '*_test.py' 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=tests::no tests found - test job skipped (placeholder)"
          fi

  test:
    name: test (py${{ matrix.python-version }})
    needs: detect-tests
    if: needs.detect-tests.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          prune-cache: false
          cache-suffix: test-${{ matrix.python-version }}
          cache-dependency-glob: pyproject.toml
      - uses: extractions/setup-just@v3
      - name: Install test environment (CPU only)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group test
          .venv/bin/python setup_wheels.py --skip gpu-wheels   # pytorch-dnc from git; no CUDA on runners
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run tests
        run: just test

  # Diagnostic only: install the pinned Mamba source package without CUDA
  # extensions, then run the real controller forward/backward cases on CPU.
  # This job is non-blocking because an unsupported CPU kernel path is the
  # capability result we are measuring, not a regression in the baseline suite.
  mamba-cpu-probe:
    name: Mamba CPU capability probe (non-blocking)
    needs: detect-tests
    if: needs.detect-tests.outputs.present == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: false
          cache-suffix: mamba-cpu-probe
          cache-dependency-glob: pyproject.toml
      - name: Install CPU test environment
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e . --group test
          .venv/bin/python setup_wheels.py --skip gpu-wheels
      - name: Install pinned Mamba package without CUDA extensions
        id: install-mamba
        continue-on-error: true
        run: |
          MAMBA_SKIP_CUDA_BUILD=TRUE uv pip install --python .venv/bin/python --no-build-isolation "mamba-ssm==2.3.2.post1"
      - name: Run Mamba controller tests on CPU
        id: mamba-tests
        if: steps.install-mamba.outcome == 'success'
        continue-on-error: true
        run: |
          .venv/bin/python -c "import torch; assert not torch.cuda.is_available(), 'Expected CPU-only PyTorch'; print(f'PyTorch {torch.__version__}; CUDA unavailable')"
          .venv/bin/python -m pytest tests/integration/test_controller_matrix.py -m "not gpu" -k "test_controller_forward_backward and mamba" --junitxml=mamba-cpu-results.xml
          .venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("mamba-cpu-results.xml").getroot()
          suites = list(root.iter("testsuite"))
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
          skipped = sum(
              1 for case in root.iter("testcase") if case.find("skipped") is not None
          )
          assert tests == 5, f"Expected all 5 Mamba controller cases to execute; found {tests}"
          assert skipped == 0, f"Expected no skipped Mamba controller cases; found {skipped}"
          PY
      - name: Report CPU probe outcome
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install-mamba.outcome }}
          TEST_OUTCOME: ${{ steps.mamba-tests.outcome }}
        run: |
          {
            echo "### Mamba CPU capability probe"
            echo "- Pinned package installation: ${INSTALL_OUTCOME}"
            echo "- CPU controller tests: ${TEST_OUTCOME}"
            echo "- See this job's step logs for the exact installation or kernel error."
          } >> "$GITHUB_STEP_SUMMARY"
