[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "initium-deeplearning"       # PyPI distribution name; Python imports remain `initium`
dynamic = ["version"]                # from src/__init__.py
description = "Differentiable Neural Computer research framework with pluggable LSTM/Mamba/CfC controllers, MoE, split-graph and stochastic write heads."
readme = "README.md"
requires-python = ">=3.10"           # code uses `X | None` at runtime
authors = [{ name = "samueleternity" }]
license = "GPL-3.0"
license-files = ["LICENSE"]
keywords = ["dnc", "differentiable-neural-computer", "mamba", "liquid-neural-networks", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Only what PyPI can express. GPU wheels (mamba-ssm, causal-conv1d) and git-pinned pytorch-dnc
# are installed by `initium-setup` (initium/setup_wheels.py).
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "dnc>=1.1.0",   # replaced by the git version through `initium-setup`
  "ncps>=0.0.7",
]

[project.optional-dependencies]
text = ["tokenizers>=0.19"]          # fast BPE for real text data
video = ["opencv-python>=4.8"]       # real video data (audio additionally needs the ffmpeg CLI)
real-data = ["initium-deeplearning[text,video]"]

[project.scripts]
initium-setup = "initium.setup_wheels:main"
initium-infer = "initium.inference.run_inference:main"
initium-kl-attribution = "initium.analysis.kl_attribution:main"

[project.urls]
Homepage = "https://github.com/samueleternity/initium"
Issues = "https://github.com/samueleternity/initium/issues"

# PEP 735 groups: pip>=25.1 (--group), uv, pdm>=2.13.
[dependency-groups]
lint = ["ruff>=0.12"]                # pin exactly once you settle on a version (format output drifts)
typecheck = ["mypy>=1.13", "numpy>=1.26,<2.5"]  # NumPy 2.5 stubs use Python 3.12-only syntax
test = ["pytest>=8", "pytest-cov>=5"]
dev = [
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "test" },
]

# ---------------------------------------------------------------- build
[tool.hatch.version]
path = "src/__init__.py"

# src-layout: hatchling picks up everything under src/initium as the "initium" package.
[tool.hatch.build.targets.wheel]
packages = ["src/initium"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/README.md", "/pyproject.toml", "/LICENSE",
]

[tool.uv]
required-version = ">=0.8.0"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
  "B905",   # zip() without strict=
  "E741",   # ambiguous names such as `l`
]

[tool.ruff.lint.isort]
known-first-party = ["initium"]

[tool.ruff.lint.per-file-ignores]
# Intentional import-after-code (env patches, sys.path bootstrap, circular-import avoidance).
"src/initium/core_training.py" = ["E402"]
"src/initium/inference/run_inference.py" = ["E402"]
"src/initium/data/common/real_data.py" = ["E402"]
"src/initium/mamba_controller/mamba_controller.py" = ["E402"]
"src/initium/data/multimodal/multimodal_dataset.py" = ["B023"]   # lambdas are called immediately

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src/initium"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "dnc", "dnc.*", "mamba_ssm", "mamba_ssm.*", "causal_conv1d", "causal_conv1d.*",
  "ncps", "ncps.*", "tokenizers", "tokenizers.*", "cv2",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "initium.memory_manipulation.nvrtc_compat"    # deliberate torch.prod/cumprod monkeypatching
disable_error_code = ["assignment", "method-assign"]

# ---------------------------------------------------------------- pytest (reserved)
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
  "gpu: requires a CUDA GPU with mamba-ssm/causal-conv1d installed",
  "slow: slower tests (tiny end-to-end training/inference runs)",
]
